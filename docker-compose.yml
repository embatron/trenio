services:
  postgres:
    image: postgres:16-alpine
    container_name: trenio-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: trenio
      POSTGRES_PASSWORD: trenio
      POSTGRES_DB: trenio
    volumes:
      - trenio_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trenio -d trenio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  trenio_pg_data:
