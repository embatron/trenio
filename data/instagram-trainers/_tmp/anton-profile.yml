                - /url: /leonidovich_fit/p/DQyifVnjOJN/
                - 'img "Тренировка — это не наказание за еду. Это инвестиция в себя. 💪 Ты не «сжигаешь» десерт и не «отрабатываешь» ужин. Ты тренируешься, потому что ценишь своё тело — его силу, выносливость, способность становиться лучше.🏆 Каждое повторение — вклад в здоровье. Каждый сет — в уверенность. Каждая тренировка — в будущую версию себя, которой ты будешь гордиться.🏋🏻‍♂️ Еда — это энергия. ⚡️ Движение — это уважение к себе. А баланс — это свобода. У каждого свой путь к телу мечты! Если хочешь начать тренироваться — онлайн или в зале — пиши в директ! Подберём удобный формат и составим план под твои цели 💪 …………………………………… Photo📸: @verosha.ph ❤️‍🔥 #boys #fitlife #fitness #fit #gym #sport #fitnessmodel #minsk #minskworld #belarus #insta #instamood #instafit #instagram #instaboys #motivation #минск #беларусь #спорт #тренировки #мотивация" [ref=f2e497]'
