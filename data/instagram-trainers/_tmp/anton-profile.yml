                - /url: /leonidovich_fit/p/DYZadKGAvsj/
                - 'img "Привет!🤝 Меня зовут Антон, и я тренер @body.factory.by Если ты хочешь, похудеть, набрать мышечную массу, скорректировать фигуру, сделать своё тело подтянутым и мускулистым, то тогда тебе точно нужно ко мне!🦾 Я помогу тебе сделать тело твоей мечты!🏋 С мной ты сможешь достигнуть результата быстрее, без строгих диет и чрезмерной нагрузки. Я являюсь мастером спорта международного класса🥇 и имею высшее спортивное образование 👨‍🎓. Кроме того, в спорте и тренерской деятельности имею большой опыт, поэтому нам с тобой будет комфортно найти общий язык, если ты готов работать на результат!🔥🏆 А если тебе некомфортно или не позволяет время посещать зал и тренироваться со мной лично, то ты всегда можешь пойти ко мне на онлайн ведение 📶🛜🧑‍💻 #fitness #fit #sport #minsk #belarus" [ref=f2e447]'
