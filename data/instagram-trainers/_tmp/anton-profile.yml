                - /url: /leonidovich_fit/p/DQgTouLDE39/
                - 'img "Всем привет!👋 Давненько не выходил на связь в формате «поста с фоткой» 📸 Информирую. Все хорошо) Развиваемся , работаем 🦾 Буду сейчас чаще писать посты о полезном, так что не переключайтесь📝 И все это с прекрасными фотокарточками, сделанными руками самого лучшего фотографа @verosha.ph ❤️‍🩹 Ну и не забывайте , на улице уже холодно, а лето не за горами , так что жду Вас у себя на тренировках в зале и онлайн 😉 #boys #photo #sport #gym #fit #fitnessmodel #fitness #minsk #belarus #insta #instaphoto #instalike #instafit #instaboy #instagram #instabelarus #minskworld" [ref=f2e472]'
