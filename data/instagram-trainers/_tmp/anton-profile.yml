              - link [ref=f2e481] [cursor=pointer]:
                - /url: /leonidovich_fit/p/DKpfLNjNO2O/
                - 'img "☀️⛱️Лето - это не повод пропускать тренировки , лето - это результат того , как вы готовились к пляжному сезону весь год . Поэтому к следующему сезону нужно начинать готовиться уже сейчас. Начни, как раз с «понедельника»😉 🚀Прогресс начинается там, где заканчиваются отговорки! Запомни, есть три правила: Питание 🍓🥗🥕 Тренировки 🏋🏻‍♂️💪🏅 Восстановление 😴💤😌 И четвертый пункт - немножечко терпения, старания и упорства. И только тогда будет результат. Результат не терпит слабых. И когда слабый скажет хватит, ты должен сделать еще подход. И не в генетике тут дело совсем . Смейся, потей, ошибайся - но не останавливайся🦾 Ставь лайк❤️ и пиши в директ😉 Будем разбираться с тренировочным процессом и питанием🦾 #boys#gym#sport#fit#fitness#minsk#belarus#instagram# instafit#instalike#instabelarus#instaphoto#instaboys#inst asports" [ref=f2e484]'
