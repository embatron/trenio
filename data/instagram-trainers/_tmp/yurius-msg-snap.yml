                - /url: /yurius_trainer/p/DKBnzvjo-Ld/
                - img "Завершён курс переподготовки, как Инструктор тренажерного зала в \"ФитнесОбразовании\". К моим знаниям и навыкам добавились новые. Получил даже больше, чем ожидал. Внимательные и знающие наставники, красочные и насыщенные методические материалы, приятная атмосфера общения. Как ни грустно признать, но 6 лет назад в БГУФКе было иначе, просто не сравнить. Теперь я могу дать моим подопечным, клиентам, больше, научить правильнее, и всем будет лучше, здоровее и приятнее. Ещё один шаг в развитии, продолжение следует... Кому нужен персональный тренер в зал , обращайтесь! Или рекомендуйте! Научу, подскажу, помогу🖐️" [ref=f3e498]
